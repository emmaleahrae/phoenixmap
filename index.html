<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phoenix and Cody's Map</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f4efe4;
    --paper-deep: #e7ddc9;
    --ink: #2b2620;
    --ink-soft: rgba(43,38,32,0.58);
    --ink-faint: rgba(43,38,32,0.38);
    --accent: #a9784f;
    --accent-soft: rgba(169,120,79,0.16);
    --line: rgba(43,38,32,0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  #map {
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* ---- top bar ---- */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 500;
    padding: 22px 24px 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }

  .title-block { pointer-events: auto; }
  .title-block h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 32px;
    line-height: 1;
    margin: 0;
    color: var(--ink);
  }
  .title-block p {
    margin: 6px 0 0 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .search-wrap {
    position: relative;
    pointer-events: auto;
    width: 250px;
  }
  .search-input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 11px 13px;
    color: var(--ink);
    font-size: 13.5px;
    font-family: 'Inter', sans-serif;
    outline: none;
    box-shadow: 0 1px 2px rgba(43,38,32,0.05);
  }
  .search-input::placeholder { color: var(--ink-faint); }
  .search-input:focus { border-color: var(--accent); }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
    display: none;
    box-shadow: 0 6px 20px rgba(43,38,32,0.08);
  }
  .search-results.show { display: block; }
  .search-result-item {
    padding: 10px 13px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: var(--paper-deep); }
  .search-result-item strong { color: var(--ink); }
  .search-result-item span { color: var(--ink-faint); font-size: 11.5px; margin-left: 6px; }

  /* ---- legend ---- */
  .legend {
    position: absolute;
    bottom: 24px;
    left: 24px;
    z-index: 500;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 11px 16px;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    display: flex;
    gap: 16px;
    box-shadow: 0 1px 2px rgba(43,38,32,0.05);
    pointer-events: auto;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .legend-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  /* ---- side panel ---- */
  .panel {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 340px;
    background: var(--paper);
    border-left: 1px solid var(--line);
    z-index: 600;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.65,0,0.35,1);
    display: flex;
    flex-direction: column;
    box-shadow: -12px 0 30px rgba(43,38,32,0.06);
  }
  .panel.open { transform: translateX(0); }

  .panel-header {
    padding: 30px 26px 20px 26px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .panel-header h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 28px;
    margin: 0;
    color: var(--ink);
  }
  .panel-header p {
    margin: 5px 0 0 0;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .panel-close {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .panel-close:hover { color: var(--ink); }

  .panel-body {
    padding: 6px 26px 26px 26px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .panel-body::-webkit-scrollbar { width: 5px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .video-card {
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }
  .video-card:last-child { border-bottom: none; }
  .video-card .creator {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 6px 0;
    color: var(--ink);
  }
  .video-card .caption {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 12px 0;
  }
  .video-card .card-footer {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .tag-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .video-link {
    display: block;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.03em;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-faint);
    white-space: nowrap;
  }
  .video-link:hover { border-bottom-color: var(--ink); }

  .no-videos {
    font-size: 13px;
    color: var(--ink-faint);
  }

  /* ---- leaflet overrides ---- */
  .leaflet-popup-content-wrapper {
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    border: 1px solid var(--line);
    box-shadow: 0 6px 20px rgba(43,38,32,0.08);
  }
  .leaflet-popup-tip { background: var(--paper); border: 1px solid var(--line); border-top: none; }
  .leaflet-popup-content {
    margin: 12px 14px;
    font-family: 'Inter', sans-serif;
  }
  .leaflet-popup-content p {
    margin: 0 0 8px 0;
  }

  .popup-city {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 18px;
    color: var(--ink);
  }
  .popup-count {
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .popup-link {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-faint);
    margin-top: 4px;
  }
  .popup-link:hover { border-bottom-color: var(--ink); }

  .city-label {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 2px 6px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    pointer-events: none;
  }
  .leaflet-tooltip.city-label { background: var(--paper); box-shadow: 0 2px 8px rgba(43,38,32,0.06); }

  .leaflet-control-zoom-in,
  .leaflet-control-zoom-out {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    font-size: 16px;
    font-weight: 600;
    width: 34px !important;
    height: 34px !important;
    line-height: 34px;
  }
  .leaflet-control-zoom-in:hover,
  .leaflet-control-zoom-out:hover {
    background: var(--paper-deep);
  }

  .marker-pin {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(43,38,32,0.15);
    cursor: pointer;
  }
  .marker-pin.selected {
    background: var(--ink);
    box-shadow: 0 4px 12px rgba(43,38,32,0.25);
  }
  .marker-pin span {
    font-size: 13px;
    color: var(--paper);
    font-weight: 600;
  }

  .marker-cluster {
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--ink);
  }

  /* Spirit Profile Panel (Bottom Slide) */
  .spirit-profile {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 50%;
    background: var(--paper);
    border-top: 1px solid var(--line);
    z-index: 650;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.65,0,0.35,1);
    display: flex;
    flex-direction: column;
    box-shadow: 0 -12px 30px rgba(43,38,32,0.06);
  }
  .spirit-profile.show { transform: translateY(0); }

  .spirit-profile-content {
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
  }

  .spirit-profile-header {
    padding: 26px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .spirit-profile-header h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 4px 0;
    color: var(--ink);
  }

  .spirit-profile-type {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }

  .spirit-profile-body {
    flex: 1;
    overflow-y: auto;
    padding: 26px;
  }

  .spirit-profile-section {
    margin-bottom: 24px;
  }

  .spirit-profile-section-title {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink-soft);
    margin: 0 0 10px 0;
  }

  .spirit-profile-description {
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    margin: 0 0 16px 0;
  }

  .spirit-profile-item {
    font-size: 12px;
    color: var(--ink);
    margin: 8px 0;
    padding-left: 16px;
    position: relative;
  }

  .spirit-profile-item:before {
    content: '•';
    position: absolute;
    left: 4px;
  }

  .spirit-profile-location-card {
    padding: 12px;
    background: #f9f7f4;
    border: 1px solid #f0ede7;
    border-radius: 3px;
    margin: 8px 0;
    cursor: pointer;
    transition: background 0.2s;
  }

  .spirit-profile-location-card:hover {
    background: #f3efe8;
  }

  .spirit-profile-location-name {
    font-weight: 500;
    font-size: 12px;
    color: var(--ink);
    margin: 0 0 2px 0;
  }

  .spirit-profile-location-date {
    font-size: 11px;
    color: var(--ink-faint);
    margin: 0;
  }

  .spirit-profile-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .spirit-profile-close:hover { color: var(--ink); }

  @media (max-width: 640px) {
    .panel { width: 100%; }
    .search-wrap { width: 140px; }
    .title-block p { display: none; }
    .legend { flex-wrap: wrap; max-width: calc(100% - 48px); }
    .spirit-profile { height: 70%; }
  }

  /* Spirit Type Modal */
  .spirit-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(43, 38, 32, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .spirit-modal.show {
    opacity: 1;
    pointer-events: all;
  }

  .spirit-modal-content {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 90%;
    max-width: 500px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(43, 38, 32, 0.15);
  }

  .spirit-modal-header {
    padding: 26px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .spirit-modal-header h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    color: var(--ink);
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover { color: var(--ink); }

  .spirit-modal-list {
    overflow-y: auto;
    padding: 0;
  }

  .spirit-modal-item {
    padding: 16px 26px;
    border-bottom: 1px solid #f0ede7;
    cursor: pointer;
    transition: all 0.2s;
  }
  .spirit-modal-item:hover {
    background: #f9f7f4;
  }
  .spirit-modal-item:last-child {
    border-bottom: none;
  }

  .spirit-modal-item-name {
    font-family: 'Fraunces', serif !important;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin: 0 0 8px 0;
  }

  .spirit-modal-item-location {
    font-size: 12px;
    color: var(--accent);
    margin: 4px 0;
    padding: 4px 0;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: var(--accent-soft);
    transition: color 0.2s;
  }
  
  .spirit-modal-item-location:hover {
    color: var(--ink);
  }

  ::selection { background: var(--accent-soft); }
</style>
</head>

    <h1>Phoenix and Cody's Map</h1>

<div class="spirit-modal" id="spiritModal">

<div class="spirit-profile" id="spiritProfile">

</div>

  // =================================================================
  // MAP SETUP
  // =================================================================
  const map = L.map('map', {
    zoomControl: false,
    crs: L.CRS.EPSG3857,
    worldCopyJump: false,
    continuousWorld: false,
    noWrap: true
  }).setView([20, 0], 2);

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    noWrap: true
  }).addTo(map);

  // ===== legend =====
  const legendEl = document.getElementById('legend');
  Object.entries(categoryColors).forEach(([name, color]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${name}`;
    legendEl.appendChild(item);
  });

  // =================================================================
  // MARKERS
  // =================================================================
  const markerGroup = L.featureGroup().addTo(map);
  const markersByCity = {};

  cities.forEach(city => {
    const icon = L.divIcon({
      html: `<div class="marker-pin"><span>${city.rulingSpirits.length}</span></div>`,
      iconSize: [28, 28],
      className: ''
    });

    const marker = L.marker([city.lat, city.lng], { icon })
      .on('click', () => openCity(city))
      .bindTooltip(city.name, { permanent: true, direction: 'top', offset: [0, -20], className: 'city-label' })
      .bindPopup(`
        <p class="popup-city">${city.name}</p>
        <p class="popup-count">${city.rulingSpirits.length} spirit${city.rulingSpirits.length !== 1 ? 's' : ''}</p>
        <a class="popup-link" onclick="event.preventDefault(); event.stopPropagation();" href="#">View details →</a>
      `);

    marker.on('popupopen', () => {
      const popupLink = marker.getPopup().getElement().querySelector('.popup-link');
      if (popupLink) {
        popupLink.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          openCity(city);
          marker.closePopup();
        };
      }
    });

    markerGroup.addLayer(marker);
    markersByCity[city.name] = { marker, city };
  });

  // =================================================================
  // PANEL
  // =================================================================
  const panel = document.getElementById('panel');
  // Store previous map state
  let previousMapState = null;

  const panelCity = document.getElementById('panelCity');
  const panelSub = document.getElementById('panelSub');
  const panelBody = document.getElementById('panelBody');

  function openCity(city) {
    // Save current map state before changing it
    previousMapState = {
      center: map.getCenter(),
      zoom: map.getZoom()
    };
    
    panelCity.textContent = city.name;
    panelSub.textContent = city.country;
    
    // Remove any previously added info elements
    const existingInfo = panelSub.parentElement.querySelectorAll('p[data-info="true"]');
    existingInfo.forEach(el => el.remove());
    
    // Add hint about clicking spirits
    const hint = document.createElement('p');
    hint.setAttribute('data-info', 'true');
    hint.style.fontSize = '10px';
    hint.style.color = 'var(--accent)';
    hint.style.margin = '4px 0 0 0';
    hint.style.fontStyle = 'italic';
    hint.textContent = 'Click any spirit name ↗ to see profile';
    panelSub.parentElement.insertBefore(hint, panelSub.nextSibling);
    
    // Add previously known as info if exists
    if (city.previouslyKnownAs) {
      const previousInfo = document.createElement('p');
      previousInfo.setAttribute('data-info', 'true');
      previousInfo.style.fontSize = '10px';
      previousInfo.style.color = 'var(--ink-soft)';
      previousInfo.style.margin = '4px 0 0 0';
      previousInfo.style.textTransform = 'uppercase';
      previousInfo.style.letterSpacing = '0.02em';
      previousInfo.textContent = 'Previously known by God as "' + city.previouslyKnownAs + '"';
      panelSub.parentElement.insertBefore(previousInfo, panelSub.nextSibling);
    }
    
    // Add date info
    const dateInfo = document.createElement('p');
    dateInfo.setAttribute('data-info', 'true');
    dateInfo.style.fontSize = '10px';
    dateInfo.style.color = 'var(--ink-soft)';
    dateInfo.style.margin = '4px 0 0 0';
    dateInfo.style.textTransform = 'uppercase';
    dateInfo.style.letterSpacing = '0.02em';
    dateInfo.textContent = 'Current as of ' + city.date;
    panelSub.parentElement.insertBefore(dateInfo, panelSub.nextSibling);

    panelBody.innerHTML = '';
    
    // Source Section Header (only if not Europe)
    if (city.name !== "Europe") {
      const sourceHeader = document.createElement('p');
      sourceHeader.style.fontSize = '11.5px';
      sourceHeader.style.letterSpacing = '0.04em';
      sourceHeader.style.textTransform = 'uppercase';
      sourceHeader.style.fontWeight = '500';
      sourceHeader.style.color = 'var(--ink-soft)';
      sourceHeader.style.margin = '0 0 10px 0';
      sourceHeader.textContent = 'Source';
      panelBody.appendChild(sourceHeader);
      
      // Details Card
      const card = document.createElement('div');
      card.className = 'video-card';
      
      const creatorP = document.createElement('p');
      creatorP.className = 'creator';
      creatorP.textContent = city.creator;
      
      const captionP = document.createElement('p');
      captionP.className = 'caption';
      captionP.textContent = city.caption;
      
      const cardFooter = document.createElement('div');
      cardFooter.className = 'card-footer';
      
      // Handle both single videoUrl and multiple videoUrls
      const urls = city.videoUrls || (city.videoUrl ? [city.videoUrl] : []);
      urls.forEach((url, idx) => {
        const link = document.createElement('a');
        link.className = 'video-link';
        link.href = url;
        link.target = '_blank';
        link.textContent = urls.length > 1 ? `Part ${String.fromCharCode(65 + idx)} ↗` : 'View Post on Instagram ↗';
        cardFooter.appendChild(link);
      });
      
      card.appendChild(creatorP);
      card.appendChild(captionP);
      card.appendChild(cardFooter);
      panelBody.appendChild(card);
      
      const sourceSpacer = document.createElement('div');
      sourceSpacer.style.height = '18px';
      panelBody.appendChild(sourceSpacer);
    }
    
    // Ruling Spirits Section
    const spiritsSection = document.createElement('div');
    spiritsSection.style.marginBottom = '22px';
    
    const spiritsHeader = document.createElement('p');
    spiritsHeader.style.fontSize = '11.5px';
    spiritsHeader.style.letterSpacing = '0.04em';
    spiritsHeader.style.textTransform = 'uppercase';
    spiritsHeader.style.fontWeight = '500';
    spiritsHeader.style.color = 'var(--ink-soft)';
    spiritsHeader.style.margin = '0 0 10px 0';
    spiritsHeader.textContent = "God's Current Ruling Principalities";
    spiritsSection.appendChild(spiritsHeader);
    
    city.rulingSpirits.forEach((spirit, spiritIdx) => {
      const spiritItem = document.createElement('div');
      spiritItem.style.marginBottom = '12px';
      
      const spiritName = document.createElement('p');
      spiritName.style.fontSize = '13.5px';
      spiritName.style.fontWeight = '500';
      spiritName.style.color = 'var(--accent)';
      spiritName.style.margin = '0 0 4px 0';
      spiritName.style.cursor = 'pointer';
      spiritName.style.userSelect = 'none';
      spiritName.style.textDecoration = 'underline';
      spiritName.style.textDecorationColor = 'var(--accent)';
      spiritName.textContent = spirit.name + ' ▼';
      spiritName.id = `spirit-${spiritIdx}`;
      spiritName.title = 'Click to view spirit profile';
      spiritName.onmouseover = () => {
        spiritName.style.opacity = '0.7';
      };
      spiritName.onmouseout = () => {
        spiritName.style.opacity = '1';
      };
      
      const expandedSpirit = document.createElement('div');
      expandedSpirit.id = `spirit-content-${spiritIdx}`;
      expandedSpirit.style.display = 'block';
      expandedSpirit.style.marginTop = '8px';
      expandedSpirit.style.paddingTop = '8px';
      expandedSpirit.style.borderTop = '1px solid #eee';
      
      // Toggle collapse/expand functionality
      spiritName.onclick = (e) => {
        e.stopPropagation();
        const isOpen = expandedSpirit.style.display !== 'none';
        if (isOpen) {
          expandedSpirit.style.display = 'none';
          spiritName.textContent = spirit.name + ' ▶';
        } else {
          expandedSpirit.style.display = 'block';
          spiritName.textContent = spirit.name + ' ▼';
        }
      };
      
      if (spirit.description) {
        const spiritDesc = document.createElement('p');
        spiritDesc.style.fontSize = '12px';
        spiritDesc.style.color = 'var(--ink-soft)';
        spiritDesc.style.margin = '0';
        spiritDesc.style.lineHeight = '1.4';
        spiritDesc.textContent = spirit.description;
        expandedSpirit.appendChild(spiritDesc);
      }
      
      // Type tag - always visible, outside collapsible section
      const typeTag = document.createElement('p');
      typeTag.style.fontSize = '10px';
      typeTag.style.color = 'var(--accent)';
      typeTag.style.margin = '8px 0 0 0';
      typeTag.style.textTransform = 'uppercase';
      typeTag.style.letterSpacing = '0.02em';
      typeTag.style.cursor = 'pointer';
      typeTag.style.borderBottom = '1px solid var(--accent)';
      typeTag.style.display = 'inline-block';
      typeTag.textContent = spirit.type;
      typeTag.onclick = (e) => {
        e.stopPropagation();
        showSpiritTypeModal(spirit.type);
      };
      
      spiritItem.appendChild(spiritName);
      spiritItem.appendChild(expandedSpirit);
      spiritItem.appendChild(typeTag);
      spiritsSection.appendChild(spiritItem);
    });

    // Display ruling note if no spirits but note exists
    if (city.rulingSpirits.length === 0 && city.rulingNote) {
      const noteP = document.createElement('p');
      noteP.style.fontSize = '12px';
      noteP.style.color = 'var(--ink-soft)';
      noteP.style.margin = '0';
      noteP.style.lineHeight = '1.4';
      noteP.textContent = city.rulingNote;
      spiritsSection.appendChild(noteP);
    }
    
    panelBody.appendChild(spiritsSection);
    
    // Demonic Principalities Section
    const demoSection = document.createElement('div');
    demoSection.style.borderTop = '1px solid var(--line)';
    demoSection.style.paddingTop = '18px';
    demoSection.style.marginBottom = '18px';
    
    const demoHeader = document.createElement('p');
    demoHeader.style.fontSize = '11.5px';
    demoHeader.style.letterSpacing = '0.04em';
    demoHeader.style.textTransform = 'uppercase';
    demoHeader.style.fontWeight = '500';
    demoHeader.style.color = 'var(--ink-soft)';
    demoHeader.style.margin = '0 0 10px 0';
    demoHeader.textContent = 'Prior Demonic Spirits';
    demoSection.appendChild(demoHeader);
    
    city.demonicPrincipalities.forEach((demo, idx) => {
      const demoItem = document.createElement('div');
      demoItem.style.marginBottom = '12px';
      
      const demoName = document.createElement('p');
      demoName.style.fontSize = '13.5px';
      demoName.style.fontWeight = '500';
      demoName.style.color = 'var(--accent)';
      demoName.style.margin = '0 0 4px 0';
      demoName.style.cursor = 'pointer';
      demoName.style.userSelect = 'none';
      demoName.style.textDecoration = 'underline';
      demoName.style.textDecorationColor = 'var(--accent)';
      demoName.textContent = demo.name + ' ▶';
      demoName.id = `demo-${idx}`;
      demoName.title = 'Click to view spirit profile';
      demoName.onmouseover = () => {
        demoName.style.opacity = '0.7';
      };
      demoName.onmouseout = () => {
        demoName.style.opacity = '1';
      };
      
      const expandedContent = document.createElement('div');
      expandedContent.id = `demo-content-${idx}`;
      expandedContent.style.display = 'none';
      expandedContent.style.marginTop = '8px';
      expandedContent.style.paddingTop = '8px';
      expandedContent.style.borderTop = '1px solid #eee';
      
      if (demo.description) {
        const demoDesc = document.createElement('p');
        demoDesc.style.fontSize = '12px';
        demoDesc.style.color = 'var(--ink-soft)';
        demoDesc.style.margin = '0 0 8px 0';
        demoDesc.style.lineHeight = '1.4';
        demoDesc.textContent = demo.description;
        expandedContent.appendChild(demoDesc);
      }
      
      if (demo.alsoKnownAs && demo.alsoKnownAs.length > 0) {
        const alsoKnownContainer = document.createElement('p');
        alsoKnownContainer.style.fontSize = '11px';
        alsoKnownContainer.style.color = '#666';
        alsoKnownContainer.style.margin = '0';
        alsoKnownContainer.innerHTML = 'Also known as: ';
        
        demo.alsoKnownAs.forEach((altName, altIdx) => {
          const link = document.createElement('a');
          link.href = '#';
          link.style.color = 'var(--accent)';
          link.style.textDecoration = 'none';
          link.style.cursor = 'pointer';
          link.style.borderBottom = '1px solid var(--accent)';
          link.textContent = altName;
          link.onclick = (e) => {
            e.preventDefault();
            searchInput.value = altName;
            searchInput.dispatchEvent(new Event('input'));
          };
          alsoKnownContainer.appendChild(link);
          
          if (altIdx < demo.alsoKnownAs.length - 1) {
            const comma = document.createElement('span');
            comma.textContent = ', ';
            alsoKnownContainer.appendChild(comma);
          }
        });
        
        expandedContent.appendChild(alsoKnownContainer);
      }
      
      // Toggle functionality
      demoName.onclick = (e) => {
        e.stopPropagation();
        showSpiritProfile(demo.name);
      };
      
      demoItem.appendChild(demoName);
      demoItem.appendChild(expandedContent);
      demoSection.appendChild(demoItem);
    });
    
    panelBody.appendChild(demoSection);

    panel.classList.add('open');
    
    // highlight marker
    document.querySelectorAll('.marker-pin').forEach(m => m.classList.remove('selected'));
    const marker = markersByCity[city.name]?.marker;
    if (marker) {
      marker.getElement()?.querySelector('.marker-pin').classList.add('selected');
    }

    // pan map to city
    map.setView([city.lat, city.lng], 10, { animate: true });
  }

  document.getElementById('panelClose').addEventListener('click', () => {
    panel.classList.remove('open');
    document.querySelectorAll('.marker-pin').forEach(m => m.classList.remove('selected'));
    
    // Restore previous map state
    if (previousMapState) {
      map.setView(previousMapState.center, previousMapState.zoom, { animate: true });
      previousMapState = null;
    }
  });

  // =================================================================
  // SPIRIT TYPE MODAL
  // =================================================================
  const spiritModal = document.getElementById('spiritModal');
  const spiritModalClose = document.getElementById('spiritModalClose');
  const spiritModalTitle = document.getElementById('spiritModalTitle');
  const spiritModalList = document.getElementById('spiritModalList');

  function showSpiritTypeModal(spiritType) {
    // Collect all spirits of this type, grouped by name
    const spiritMap = {};
    cities.forEach(city => {
      city.rulingSpirits.forEach(spirit => {
        if (spirit.type === spiritType) {
          if (!spiritMap[spirit.name]) {
            spiritMap[spirit.name] = [];
          }
          spiritMap[spirit.name].push({ city: city.name, country: city.country, date: city.date });
        }
      });
      city.demonicPrincipalities.forEach(spirit => {
        if (spirit.type === spiritType) {
          if (!spiritMap[spirit.name]) {
            spiritMap[spirit.name] = [];
          }
          spiritMap[spirit.name].push({ city: city.name, country: city.country, date: city.date });
        }
      });
    });

    // Sort spirit names alphabetically
    const sortedNames = Object.keys(spiritMap).sort();

    // Update modal
    spiritModalTitle.textContent = spiritType;
    spiritModalList.innerHTML = '';
    
    sortedNames.forEach(spiritName => {
      const locations = spiritMap[spiritName];
      
      // Create main spirit item
      const item = document.createElement('div');
      item.className = 'spirit-modal-item';
      
      const name = document.createElement('p');
      name.className = 'spirit-modal-item-name';
      name.textContent = spiritName;
      
      item.appendChild(name);
      
      // Add all locations for this spirit
      locations.forEach(loc => {
        const location = document.createElement('p');
        location.className = 'spirit-modal-item-location';
        location.textContent = `${loc.city}, ${loc.country}`;
        location.onclick = (e) => {
          e.stopPropagation();
          const city = cities.find(c => c.name === loc.city);
          if (city) {
            spiritModal.classList.remove('show');
            openCity(city);
          }
        };
        item.appendChild(location);
      });
      
      item.onclick = () => {
        spiritModal.classList.remove('show');
        showSpiritProfile(spiritName);
      };
      
      spiritModalList.appendChild(item);
    });

    spiritModal.classList.add('show');
  }

  spiritModalClose.addEventListener('click', () => {
    spiritModal.classList.remove('show');
  });

  spiritModal.addEventListener('click', (e) => {
    if (e.target === spiritModal) {
      spiritModal.classList.remove('show');
    }
  });

  // =================================================================
  // SPIRIT PROFILE PANEL
  // =================================================================
  const spiritProfile = document.getElementById('spiritProfile');
  const spiritProfileClose = document.getElementById('spiritProfileClose');
  const spiritProfileHeader = document.getElementById('spiritProfileHeader');
  const spiritProfileBody = document.getElementById('spiritProfileBody');

  function showSpiritProfile(spiritName) {
    // Find the main spirit (handle alternate names)
    let displayName = spiritName; // Show the clicked name as title
    let mainSpirit = null;
    let spiritType = null;
    let foundLocations = [];

    // Search for the spirit in all cities
    for (let city of cities) {
      // Check ruling spirits
      for (let spirit of city.rulingSpirits) {
        if (spirit.name === spiritName) {
          mainSpirit = spirit;
          spiritType = 'ruling';
          foundLocations.push({ 
            name: city.name, 
            country: city.country, 
            date: city.date,
            type: spiritType 
          });
        } else if (spirit.alsoKnownAs && spirit.alsoKnownAs.includes(spiritName)) {
          mainSpirit = spirit;
          spiritType = 'ruling';
          foundLocations.push({ 
            name: city.name, 
            country: city.country, 
            date: city.date,
            type: spiritType 
          });
        }
      }

      // Check demonic spirits
      for (let spirit of city.demonicPrincipalities) {
        if (spirit.name === spiritName) {
          mainSpirit = spirit;
          spiritType = 'demonic';
          foundLocations.push({ 
            name: city.name, 
            country: city.country, 
            date: city.date,
            type: spiritType 
          });
        } else if (spirit.alsoKnownAs && spirit.alsoKnownAs.includes(spiritName)) {
          mainSpirit = spirit;
          spiritType = 'demonic';
          foundLocations.push({ 
            name: city.name, 
            country: city.country, 
            date: city.date,
            type: spiritType 
          });
        }
      }
    }

    if (!mainSpirit) return;

    // Build profile header - use clicked name as display name
    spiritProfileHeader.innerHTML = '';
    const headerContent = document.createElement('div');
    
    const title = document.createElement('h2');
    title.textContent = displayName; // Show the clicked name (could be Lucifer, Ra, Apollo, etc)
    
    const typeTag = document.createElement('p');
    typeTag.className = 'spirit-profile-type';
    // Prepend "Demonic" for demonic spirits
    const displayType = spiritType === 'demonic' ? `Demonic ${mainSpirit.type}` : mainSpirit.type;
    typeTag.textContent = displayType;
    
    headerContent.appendChild(title);
    headerContent.appendChild(typeTag);
    spiritProfileHeader.appendChild(headerContent);

    // Build profile body
    spiritProfileBody.innerHTML = '';

    // Description section - show all unique descriptions by location
    const descriptionsByLocation = [];
    for (let city of cities) {
      // Check ruling spirits
      for (let spirit of city.rulingSpirits) {
        if (spirit.name === displayName || (spirit.alsoKnownAs && spirit.alsoKnownAs.includes(displayName))) {
          descriptionsByLocation.push({
            description: spirit.description,
            city: city.name,
            country: city.country
          });
        }
      }

      // Check demonic spirits
      for (let spirit of city.demonicPrincipalities) {
        if (spirit.name === displayName || (spirit.alsoKnownAs && spirit.alsoKnownAs.includes(displayName))) {
          descriptionsByLocation.push({
            description: spirit.description,
            city: city.name,
            country: city.country
          });
        }
      }
    }

    if (descriptionsByLocation.length > 0) {
      const descSection = document.createElement('div');
      descSection.className = 'spirit-profile-section';
      
      descriptionsByLocation.forEach((desc, idx) => {
        const descP = document.createElement('p');
        descP.className = 'spirit-profile-description';
        descP.innerHTML = `<strong>${desc.city}, ${desc.country}:</strong><br>${desc.description}`;
        descSection.appendChild(descP);
        
        // Add spacing between multiple descriptions
        if (idx < descriptionsByLocation.length - 1) {
          descP.style.marginBottom = '12px';
        }
      });
      
      spiritProfileBody.appendChild(descSection);
    }

    // Alternate names section
    if (mainSpirit.alsoKnownAs && mainSpirit.alsoKnownAs.length > 0) {
      const altSection = document.createElement('div');
      altSection.className = 'spirit-profile-section';
      
      const altTitle = document.createElement('p');
      altTitle.className = 'spirit-profile-section-title';
      altTitle.textContent = 'Also Known As';
      altSection.appendChild(altTitle);
      
      // Show all alternate names
      const allNames = [mainSpirit.name, ...mainSpirit.alsoKnownAs];
      allNames.forEach(name => {
        if (name !== displayName) { // Don't show the current name as an alternate
          const altItem = document.createElement('p');
          altItem.className = 'spirit-profile-item';
          altItem.style.cursor = 'pointer';
          altItem.style.textDecoration = 'underline';
          altItem.style.color = 'var(--ink)';
          altItem.textContent = name;
          altItem.onclick = () => showSpiritProfile(name);
          altSection.appendChild(altItem);
        }
      });
      
      spiritProfileBody.appendChild(altSection);
    }

    // Locations section
    if (foundLocations.length > 0) {
      // Sort locations: Continental first, then by date (newest first)
      foundLocations.sort((a, b) => {
        // Continental locations come first
        if (a.country === 'Continental' && b.country !== 'Continental') return -1;
        if (a.country !== 'Continental' && b.country === 'Continental') return 1;
        // Then sort by date (newest first)
        return new Date(b.date) - new Date(a.date);
      });
      
      const locSection = document.createElement('div');
      locSection.className = 'spirit-profile-section';
      
      const locTitle = document.createElement('p');
      locTitle.className = 'spirit-profile-section-title';
      locTitle.textContent = `Found In (${foundLocations.length})`;
      locSection.appendChild(locTitle);
      
      foundLocations.forEach(loc => {
        const locCard = document.createElement('div');
        locCard.className = 'spirit-profile-location-card';
        locCard.onclick = () => {
          const city = cities.find(c => c.name === loc.name);
          if (city) {
            spiritProfile.classList.remove('show');
            openCity(city);
          }
        };
        
        const locName = document.createElement('p');
        locName.className = 'spirit-profile-location-name';
        locName.textContent = `${loc.name}, ${loc.country}`;
        
        const locDate = document.createElement('p');
        locDate.className = 'spirit-profile-location-date';
        locDate.textContent = loc.date;
        
        locCard.appendChild(locName);
        locCard.appendChild(locDate);
        locSection.appendChild(locCard);
      });
      
      spiritProfileBody.appendChild(locSection);
    }

    // Instagram Posts section
    const instagramPosts = [];
    for (let city of cities) {
      // Check if spirit appears in this city (ruling or demonic)
      let hasSpirit = false;
      
      for (let spirit of city.rulingSpirits) {
        if (spirit.name === displayName || (spirit.alsoKnownAs && spirit.alsoKnownAs.includes(displayName))) {
          hasSpirit = true;
          break;
        }
      }
      
      if (!hasSpirit) {
        for (let spirit of city.demonicPrincipalities) {
          if (spirit.name === displayName || (spirit.alsoKnownAs && spirit.alsoKnownAs.includes(displayName))) {
            hasSpirit = true;
            break;
          }
        }
      }
      
      // If spirit is in this city, collect its Instagram links
      if (hasSpirit) {
        if (city.videoUrls && Array.isArray(city.videoUrls)) {
          city.videoUrls.forEach(url => {
            if (url !== '#') {
              instagramPosts.push({ url, city: city.name, country: city.country });
            }
          });
        } else if (city.videoUrl && city.videoUrl !== '#') {
          instagramPosts.push({ url: city.videoUrl, city: city.name, country: city.country });
        }
      }
    }

    if (instagramPosts.length > 0) {
      const instSection = document.createElement('div');
      instSection.className = 'spirit-profile-section';
      
      const instTitle = document.createElement('p');
      instTitle.className = 'spirit-profile-section-title';
      instTitle.textContent = `Instagram Posts (${instagramPosts.length})`;
      instSection.appendChild(instTitle);
      
      instagramPosts.forEach((post, idx) => {
        const postLink = document.createElement('a');
        postLink.href = post.url;
        postLink.target = '_blank';
        postLink.style.display = 'block';
        postLink.style.padding = '12px';
        postLink.style.background = '#f9f7f4';
        postLink.style.border = '1px solid #f0ede7';
        postLink.style.borderRadius = '3px';
        postLink.style.marginBottom = '8px';
        postLink.style.textDecoration = 'none';
        postLink.style.color = 'var(--ink)';
        postLink.style.cursor = 'pointer';
        postLink.style.transition = 'background 0.2s';
        
        postLink.onmouseover = () => {
          postLink.style.background = '#f3efe8';
        };
        postLink.onmouseout = () => {
          postLink.style.background = '#f9f7f4';
        };
        
        const postCity = document.createElement('p');
        postCity.style.fontWeight = '500';
        postCity.style.fontSize = '12px';
        postCity.style.margin = '0 0 2px 0';
        postCity.style.color = 'var(--ink)';
        postCity.textContent = `${post.city}, ${post.country}`;
        
        const postLabel = document.createElement('p');
        postLabel.style.fontSize = '11px';
        postLabel.style.color = 'var(--ink-faint)';
        postLabel.style.margin = '0';
        postLabel.textContent = 'View on Instagram ↗';
        
        postLink.appendChild(postCity);
        postLink.appendChild(postLabel);
        instSection.appendChild(postLink);
      });
      
      spiritProfileBody.appendChild(instSection);
    }

    spiritProfile.classList.add('show');
  }

  spiritProfileClose.addEventListener('click', () => {
    spiritProfile.classList.remove('show');
  });

  spiritProfile.addEventListener('click', (e) => {
    if (e.target === spiritProfile) {
      spiritProfile.classList.remove('show');
    }
  });

  // =================================================================
  // SEARCH
  // =================================================================
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  searchInput.addEventListener('input', () => {
    const term = searchInput.value.trim().toLowerCase();
    searchResults.innerHTML = '';
    if (!term) { searchResults.classList.remove('show'); return; }

    const matches = cities.filter(c => {
      // Search city name and country
      if (c.name.toLowerCase().includes(term) || c.country.toLowerCase().includes(term)) return true;
      
      // Search ruling spirits and their types
      if (c.rulingSpirits.some(s => 
        s.name.toLowerCase().includes(term) || 
        s.type.toLowerCase().includes(term)
      )) return true;
      
      // Search demonic principalities, their types and alternate names
      if (c.demonicPrincipalities.some(d => {
        if (d.name.toLowerCase().includes(term) || d.type.toLowerCase().includes(term)) return true;
        if (d.alsoKnownAs && d.alsoKnownAs.some(alt => alt.toLowerCase().includes(term))) return true;
        return false;
      })) return true;
      
      return false;
    });

    if (matches.length === 0) { searchResults.classList.remove('show'); return; }

    matches.forEach(c => {
      const item = document.createElement('div');
      item.className = 'search-result-item';
      item.innerHTML = `<strong>${c.name}</strong><span>${c.country}</span>`;
      item.addEventListener('click', () => {
        openCity(c);
        searchResults.classList.remove('show');
        searchInput.value = '';
      });
      searchResults.appendChild(item);
    });

    searchResults.classList.add('show');
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) searchResults.classList.remove('show');
