<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phoenix and Cody's Map</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f4efe4;
    --paper-deep: #e7ddc9;
    --ink: #2b2620;
    --ink-soft: rgba(43,38,32,0.58);
    --ink-faint: rgba(43,38,32,0.38);
    --accent: #a9784f;
    --accent-soft: rgba(169,120,79,0.16);
    --line: rgba(43,38,32,0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  #map {
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* ---- top bar ---- */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 500;
    padding: 22px 24px 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }

  .title-block { pointer-events: auto; }
  .title-block h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 32px;
    line-height: 1;
    margin: 0;
    color: var(--ink);
  }
  .title-block p {
    margin: 6px 0 0 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .search-wrap {
    position: relative;
    pointer-events: auto;
    width: 250px;
  }
  .search-input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 11px 13px;
    color: var(--ink);
    font-size: 13.5px;
    font-family: 'Inter', sans-serif;
    outline: none;
    box-shadow: 0 1px 2px rgba(43,38,32,0.05);
  }
  .search-input::placeholder { color: var(--ink-faint); }
  .search-input:focus { border-color: var(--accent); }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
    display: none;
    box-shadow: 0 6px 20px rgba(43,38,32,0.08);
  }
  .search-results.show { display: block; }
  .search-result-item {
    padding: 10px 13px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: var(--paper-deep); }
  .search-result-item strong { color: var(--ink); }
  .search-result-item span { color: var(--ink-faint); font-size: 11.5px; margin-left: 6px; }

  /* ---- legend ---- */
  .legend {
    position: absolute;
    bottom: 24px;
    left: 24px;
    z-index: 500;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 11px 16px;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    display: flex;
    gap: 16px;
    box-shadow: 0 1px 2px rgba(43,38,32,0.05);
    pointer-events: auto;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .legend-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  /* ---- side panel ---- */
  .panel {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 340px;
    background: var(--paper);
    border-left: 1px solid var(--line);
    z-index: 600;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.65,0,0.35,1);
    display: flex;
    flex-direction: column;
    box-shadow: -12px 0 30px rgba(43,38,32,0.06);
  }
  .panel.open { transform: translateX(0); }

  .panel-header {
    padding: 30px 26px 20px 26px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .panel-header h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 28px;
    margin: 0;
    color: var(--ink);
  }
  .panel-header p {
    margin: 5px 0 0 0;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .panel-close {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .panel-close:hover { color: var(--ink); }

  .panel-body {
    padding: 6px 26px 26px 26px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .panel-body::-webkit-scrollbar { width: 5px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .video-card {
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }
  .video-card:last-child { border-bottom: none; }
  .video-card .creator {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 6px 0;
    color: var(--ink);
  }
  .video-card .caption {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 12px 0;
  }
  .video-card .card-footer {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .tag-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .video-link {
    display: block;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.03em;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-faint);
    white-space: nowrap;
  }
  .video-link:hover { border-bottom-color: var(--ink); }

  .no-videos {
    font-size: 13px;
    color: var(--ink-faint);
  }

  /* ---- leaflet overrides ---- */
  .leaflet-popup-content-wrapper {
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    border: 1px solid var(--line);
    box-shadow: 0 6px 20px rgba(43,38,32,0.08);
  }
  .leaflet-popup-tip { background: var(--paper); border: 1px solid var(--line); border-top: none; }
  .leaflet-popup-content {
    margin: 12px 14px;
    font-family: 'Inter', sans-serif;
  }
  .leaflet-popup-content p {
    margin: 0 0 8px 0;
  }

  .popup-city {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 18px;
    color: var(--ink);
  }
  .popup-count {
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .popup-link {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-faint);
    margin-top: 4px;
  }
  .popup-link:hover { border-bottom-color: var(--ink); }

  .city-label {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 2px 6px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    pointer-events: none;
  }
  .leaflet-tooltip.city-label { background: var(--paper); box-shadow: 0 2px 8px rgba(43,38,32,0.06); }

  .leaflet-control-zoom-in,
  .leaflet-control-zoom-out {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    font-size: 16px;
    font-weight: 600;
    width: 34px !important;
    height: 34px !important;
    line-height: 34px;
  }
  .leaflet-control-zoom-in:hover,
  .leaflet-control-zoom-out:hover {
    background: var(--paper-deep);
  }

  .marker-pin {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(43,38,32,0.15);
    cursor: pointer;
  }
  .marker-pin.selected {
    background: var(--ink);
    box-shadow: 0 4px 12px rgba(43,38,32,0.25);
  }
  .marker-pin span {
    font-size: 13px;
    color: var(--paper);
    font-weight: 600;
  }

  .marker-cluster {
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--ink);
  }

  /* Spirit Profile Panel (Bottom Slide) */
  .spirit-profile {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 50%;
    background: var(--paper);
    border-top: 1px solid var(--line);
    z-index: 650;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.65,0,0.35,1);
    display: flex;
    flex-direction: column;
    box-shadow: 0 -12px 30px rgba(43,38,32,0.06);
  }
  .spirit-profile.show { transform: translateY(0); }

  .spirit-profile-content {
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
  }

  .spirit-profile-header {
    padding: 26px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .spirit-profile-header h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 4px 0;
    color: var(--ink);
  }

  .spirit-profile-type {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }

  .spirit-profile-body {
    flex: 1;
    overflow-y: auto;
    padding: 26px;
  }

  .spirit-profile-section {
    margin-bottom: 24px;
  }

  .spirit-profile-section-title {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink-soft);
    margin: 0 0 10px 0;
  }

  .spirit-profile-description {
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    margin: 0 0 16px 0;
  }

  .spirit-profile-item {
    font-size: 12px;
    color: var(--ink);
    margin: 8px 0;
    padding-left: 16px;
    position: relative;
  }

  .spirit-profile-item:before {
    content: '•';
    position: absolute;
    left: 4px;
  }

  .spirit-profile-location-card {
    padding: 12px;
    background: #f9f7f4;
    border: 1px solid #f0ede7;
    border-radius: 3px;
    margin: 8px 0;
    cursor: pointer;
    transition: background 0.2s;
  }

  .spirit-profile-location-card:hover {
    background: #f3efe8;
  }

  .spirit-profile-location-name {
    font-weight: 500;
    font-size: 12px;
    color: var(--ink);
    margin: 0 0 2px 0;
  }

  .spirit-profile-location-date {
    font-size: 11px;
    color: var(--ink-faint);
    margin: 0;
  }

  .spirit-profile-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .spirit-profile-close:hover { color: var(--ink); }

  @media (max-width: 640px) {
    .top-bar { padding: 16px 12px 0 12px; flex-wrap: wrap; }
    .title-block h1 { font-size: 24px; }
    .search-wrap { width: 100%; margin-top: 10px; order: 3; flex-basis: 100%; }
    .title-block p { display: none; }
    .panel { width: 100%; max-height: 70vh; }
    .legend { flex-wrap: wrap; max-width: calc(100% - 48px); font-size: 10px; bottom: 12px; left: 12px; }
    .legend-item { padding: 4px 8px; }
    .spirit-profile { height: 70%; }
  }

  @media (max-width: 900px) {
    .panel { width: 50%; }
    .top-bar { padding: 16px 18px 0 18px; }
  }

  @media (max-width: 1200px) {
    .top-bar { padding: 20px 20px 0 20px; }
  }

  @media (min-width: 641px) {
    .top-bar { padding: 22px 24px 0 24px; }
  }

  /* Spirit Type Modal */
  .spirit-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(43, 38, 32, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .spirit-modal.show {
    opacity: 1;
    pointer-events: all;
  }

  .spirit-modal-content {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 90%;
    max-width: 500px;
    height: 60vh;
    max-height: 60vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(43, 38, 32, 0.15);
  }

  .spirit-modal-header {
    padding: 26px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .spirit-modal-header h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    color: var(--ink);
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover { color: var(--ink); }

  .spirit-modal-list {
    overflow-y: auto;
    padding: 0;
    flex: 1;
    min-height: 0;
  }

  .spirit-modal-item {
    padding: 16px 26px;
    border-bottom: 1px solid #f0ede7;
    cursor: pointer;
    transition: all 0.2s;
  }
  .spirit-modal-item:hover {
    background: #f9f7f4;
  }
  .spirit-modal-item:last-child {
    border-bottom: none;
  }

  .spirit-modal-item-name {
    font-family: 'Fraunces', serif !important;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin: 0 0 8px 0;
  }

  .spirit-modal-item-location {
    font-size: 12px;
    color: var(--accent);
    margin: 4px 0;
    padding: 4px 0;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: var(--accent-soft);
    transition: color 0.2s;
  }
  
  .spirit-modal-item-location:hover {
    color: var(--ink);
  }

  ::selection { background: var(--accent-soft); }
</style>
</head>
<body>

<div id="map"></div>

<div class="top-bar">
  <div class="title-block">
    <h1>Phoenix and Cody's Map</h1>
    <p>Locations from around the world.</p>
  </div>
  <div class="search-wrap">
    <input type="text" class="search-input" id="searchInput" placeholder="Search city or principality..." autocomplete="off" />
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="legend" id="legend"></div>

<div class="panel" id="panel">
  <div class="panel-header">
    <div>
      <h2 id="panelCity"></h2>
      <p id="panelSub"></p>
    </div>
    <button class="panel-close" id="panelClose">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<div class="spirit-modal" id="spiritModal">
  <div class="spirit-modal-content">
    <div class="spirit-modal-header">
      <h2 id="spiritModalTitle">Angelic Spirits</h2>
      <button class="modal-close" id="spiritModalClose">✕</button>
    </div>
    <div class="spirit-modal-list" id="spiritModalList"></div>
  </div>
</div>

<div class="spirit-profile" id="spiritProfile">
  <div class="spirit-profile-content">
    <button class="spirit-profile-close" id="spiritProfileClose">✕</button>
    <div class="spirit-profile-header" id="spiritProfileHeader"></div>
    <div class="spirit-profile-body" id="spiritProfileBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>

      btn.style.color = 'var(--ink)';

    filterButtons[name] = item;
    const isActive = name !== "Top 7 kingdom of darkness" && name !== "Top 7 kingdom of Light"; // Both Top 7 filters start inactive
    updateButtonStyle(name, color, isActive);
    
    item.onmouseover = () => {
      item.style.boxShadow = '0 1px 3px rgba(43,38,32,0.1)';
    };
    item.onmouseout = () => {
      item.style.boxShadow = 'none';
    };
    
    item.onclick = () => {
      if (activeFilters.has(name)) {
        activeFilters.delete(name);
      } else {
        activeFilters.add(name);
      }
      updateButtonStyle(name, color, activeFilters.has(name));
      updateMarkerVisibility();
      
      // If Top 7 kingdom of darkness filter was just toggled
      if (name === "Top 7 kingdom of darkness") {
        if (activeFilters.has(name)) {
          showTop7Panel(); // Show panel when filter activated
        } else {
          panel.classList.remove('open'); // Close panel when filter deactivated
        }
      }

      // If Top 7 kingdom of Light filter was just toggled
      if (name === "Top 7 kingdom of Light") {
        if (activeFilters.has(name)) {
          showTop7LightPanel(); // Show panel when filter activated
        } else {
          panel.classList.remove('open'); // Close panel when filter deactivated
        }
      }
    };
    
    legendEl.appendChild(item);
  });

  // =================================================================
  // MARKERS
  // =================================================================
  const markerGroup = L.featureGroup().addTo(map);
  const markersByCity = {};

  // Define zoom levels and location types
  function getLocationZoomLevel(city) {
    if (city.country === 'Continental') return 0; // Always show continental
    if (city.name.includes('Temple') || city.name.includes('River') || city.name.includes('Eiffel') || city.name.includes('Louvre')) return 5; // Specific monuments
    if (city.country.length > 15) return 2; // Countries (typically longer names)
    return 3; // Cities
  }

  const locationZoomLevels = {};

  cities.forEach(city => {
    const icon = L.divIcon({
      html: `<div class="marker-pin"><span>${city.rulingSpirits.length}</span></div>`,
      iconSize: [28, 28],
      className: ''
    });

    const marker = L.marker([city.lat, city.lng], { icon })
      .on('click', () => openCity(city))
      .bindTooltip(city.name, { permanent: true, direction: 'top', offset: [0, -20], className: 'city-label' })
      .bindPopup(`
        <p class="popup-city">${city.name}</p>
        <p class="popup-count">${city.rulingSpirits.length} spirit${city.rulingSpirits.length !== 1 ? 's' : ''}</p>
        <a class="popup-link" onclick="event.preventDefault(); event.stopPropagation();" href="#">View details →</a>
      `);

    marker.on('popupopen', () => {
      const popupLink = marker.getPopup().getElement().querySelector('.popup-link');
      if (popupLink) {
        popupLink.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          openCity(city);
          marker.closePopup();
        };
      }
    });

    markerGroup.addLayer(marker);
    markersByCity[city.name] = { marker, city };
    locationZoomLevels[city.name] = getLocationZoomLevel(city);
  });

  // Update marker visibility based on zoom level
  function updateMarkersByZoom() {
    const currentZoom = map.getZoom();
    const userHasFiltered = activeFilters.size !== DEFAULT_FILTERS.size; // User removed at least one filter
    
    Object.entries(markersByCity).forEach(([cityName, { marker, city }]) => {
      const requiredZoom = locationZoomLevels[cityName];
      const shouldShowByZoom = currentZoom >= requiredZoom;
      
      // Check if city matches active filters
      const hasMatchingSpirit = 
        city.rulingSpirits.some(s => {
          const matchesType = activeFilters.has(s.type);
          const isTop7Light = s.lightRanking !== undefined;
          const matchesTop7Light = activeFilters.has("Top 7 kingdom of Light") && isTop7Light;
          return matchesType || matchesTop7Light;
        }) ||
        city.demonicPrincipalities.some(s => {
          const matchesType = activeFilters.has(s.type);
          const isTop7 = s.topRanking !== undefined;
          const matchesTop7 = activeFilters.has("Top 7 kingdom of darkness") && isTop7;
          return matchesType || matchesTop7;
        });
      
      // If user actively filtered, show all matching spirits regardless of zoom
      // Otherwise, respect zoom level
      const shouldShow = hasMatchingSpirit && (userHasFiltered || shouldShowByZoom);
      
      if (shouldShow && activeFilters.size > 0) {
        markerGroup.addLayer(marker);
      } else {
        markerGroup.removeLayer(marker);
      }
    });
  }

  // Listen to zoom changes
  map.on('zoomend', updateMarkersByZoom);
  updateMarkersByZoom(); // Initial update

  function showSpiritTypeModal(spiritType) {
    // Collect all spirits of this type, grouped by name
    const spiritMap = {};
    cities.forEach(city => {
      city.rulingSpirits.forEach(spirit => {
        if (spirit.type === spiritType) {
          if (!spiritMap[spirit.name]) {
            spiritMap[spirit.name] = [];
          }
          spiritMap[spirit.name].push({ city: city.name, country: city.country, date: city.date });
        }
      });
      city.demonicPrincipalities.forEach(spirit => {
        if (spirit.type === spiritType) {
          if (!spiritMap[spirit.name]) {
            spiritMap[spirit.name] = [];
          }
          spiritMap[spirit.name].push({ city: city.name, country: city.country, date: city.date });
        }
      });
    });

    // Sort spirit names alphabetically
    const sortedNames = Object.keys(spiritMap).sort();

    // Update modal
    spiritModalTitle.textContent = spiritType;
    spiritModalList.innerHTML = '';
    
    sortedNames.forEach(spiritName => {
      const locations = spiritMap[spiritName];
      
      // Create main spirit item
      const item = document.createElement('div');
      item.className = 'spirit-modal-item';
      
      const name = document.createElement('p');
      name.className = 'spirit-modal-item-name';
      name.textContent = spiritName;
      
      item.appendChild(name);
      
      // Add all locations for this spirit
      locations.forEach(loc => {

        location.className = 'spirit-modal-item-location';
        location.textContent = `${loc.city}, ${loc.country}`;

            spiritModal.classList.remove('show');

        item.appendChild(location);
      });
      
      item.onclick = () => {
        spiritModal.classList.remove('show');
        showSpiritProfile(spiritName);
      };
      
      spiritModalList.appendChild(item);
    });

    spiritModal.classList.add('show');
  }

    // Get all Top 7 spirits ranked by topRanking
    const top7Spirits = [];
    cities.forEach(city => {
      city.demonicPrincipalities.forEach(spirit => {
        if (spirit.topRanking && !top7Spirits.find(s => s.name === spirit.name)) {
          top7Spirits.push({
            name: spirit.name,
            ranking: spirit.topRanking,
            description: spirit.mainDescription || spirit.description,
            aliases: spirit.alsoKnownAs || []
          });
        }
      });

    unassignedTop7Spirits.forEach(spirit => {
      if (spirit.topRanking && !top7Spirits.find(s => s.name === spirit.name)) {

          name: spirit.name,
          ranking: spirit.topRanking,
          description: spirit.mainDescription || spirit.description,
          aliases: spirit.alsoKnownAs || []

    // Sort by ranking

    // Update side panel header
    panelCity.textContent = 'Kingdom of darkness ranking';
    panelSub.textContent = '';

    // Clear panel body

    // Add explanation section

    const explanationTitle = document.createElement('p');

  const spiritProfile = document.getElementById('spiritProfile');
  const spiritProfileClose = document.getElementById('spiritProfileClose');
  const spiritProfileHeader = document.getElementById('spiritProfileHeader');
  const spiritProfileBody = document.getElementById('spiritProfileBody');

  // Build the full identity network across every spirit entry on the map.
  // This resolves names transitively - e.g. if Horus's entry lists Satan as
  // an alias, they're linked even if Satan's own entry doesn't list Horus
  // back. This ensures every card in a spirit's cultural network reliably
  // pulls in the same full set of locations, regardless of how any one
  // individual entry's alsoKnownAs list happens to be written.
  function getIdentityGroup(seedName) {
    const parent = {};
    const find = (x) => {
      if (!(x in parent)) parent[x] = x;
      while (parent[x] !== x) {
        parent[x] = parent[parent[x]];
        x = parent[x];
      }
      return x;
    };
    const union = (a, b) => {
      const ra = find(a), rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    };

    const allSpiritEntries = [];
    cities.forEach(city => {
      city.rulingSpirits.forEach(s => allSpiritEntries.push(s));
      city.demonicPrincipalities.forEach(s => allSpiritEntries.push(s));
    });
    unassignedTop7Spirits.forEach(s => allSpiritEntries.push(s));
    unassignedTop7Light.forEach(s => allSpiritEntries.push(s));

    allSpiritEntries.forEach(spirit => {
      find(spirit.name);
      (spirit.alsoKnownAs || []).forEach(alias => {
        find(alias);
        union(spirit.name, alias);
      });
    });

    const group = new Set([seedName]);
    if (seedName in parent) {
      const root = find(seedName);
      Object.keys(parent).forEach(name => {
        if (find(name) === root) group.add(name);
      });
    }
    return group;
  }

  function showSpiritProfile(spiritName) {
    // Find the main spirit (handle alternate names)
    let displayName = spiritName; // Show the clicked name as title
    let mainSpirit = null;
    let spiritType = null;
    let foundLocations = [];

    // Resolve the full identity network for the clicked name (transitive,
    // so it works even if some entries' alsoKnownAs lists aren't symmetric)
    const identityGroup = getIdentityGroup(spiritName);

    // Search for the spirit in all cities - match by full identity network
    // PRIORITIZE finding entries with topRanking first
    for (let city of cities) {
      // Check ruling spirits
      for (let spirit of city.rulingSpirits) {
        if (identityGroup.has(spirit.name)) {
          if (spirit.topRanking || spirit.lightRanking || !mainSpirit) {
            mainSpirit = spirit;
            spiritType = 'ruling';
          }
          foundLocations.push({ 
            name: city.name, 
            country: city.country, 
            date: city.date,
            type: 'ruling' 
          });
        }
      }

      // Check demonic spirits
      for (let spirit of city.demonicPrincipalities) {
        if (identityGroup.has(spirit.name)) {
          if (spirit.topRanking || spirit.lightRanking || !mainSpirit) {
            mainSpirit = spirit;
            spiritType = 'demonic';
          }
          foundLocations.push({ 
            name: city.name, 
            country: city.country, 
            date: city.date,
            type: 'demonic' 
          });
        }
      }
    }

    // Check spirits not yet tied to a location (e.g. Top 7 spirits pending
    // location data). Use the same topRanking-priority logic as the cities
    // loop above, so a ranked entry here can still take over as mainSpirit
    // even if a non-ranked city entry (like Shaddai El) was found first.
    for (let spirit of unassignedTop7Spirits) {
      if (identityGroup.has(spirit.name)) {
        if (spirit.topRanking || !mainSpirit) {
          mainSpirit = spirit;
          spiritType = 'demonic';
        }
      }
    }

    // Check Top 7 kingdom of Light beings not yet tied to a location
    for (let spirit of unassignedTop7Light) {
      if (identityGroup.has(spirit.name)) {
        if (spirit.lightRanking || !mainSpirit) {
          mainSpirit = spirit;
          spiritType = 'ruling';
        }
      }
    }

    if (!mainSpirit) return;

    // Build profile header - use clicked name as display name
    spiritProfileHeader.innerHTML = '';
    const headerContent = document.createElement('div');
    
    const title = document.createElement('h2');
    title.textContent = displayName; // Show the clicked name (could be Lucifer, Ra, Apollo, etc)
    
    const typeTag = document.createElement('p');
    typeTag.className = 'spirit-profile-type';
    typeTag.textContent = mainSpirit.type; // Just show the type as-is
    
    headerContent.appendChild(title);
    headerContent.appendChild(typeTag);
    
    // Add ranking tag if this spirit is in the Top 7
    if (mainSpirit.topRanking) {
      const rankingTag = document.createElement('p');
      rankingTag.className = 'spirit-profile-ranking';
      rankingTag.style.fontSize = '12px';
      rankingTag.style.color = 'var(--accent)';
      rankingTag.style.margin = '4px 0 0 0';
      rankingTag.style.fontWeight = '600';
      rankingTag.style.cursor = 'pointer';
      rankingTag.style.textDecoration = 'underline';
      rankingTag.textContent = `Ranked ${getOrdinal(mainSpirit.topRanking)} in kingdom of darkness`;
      rankingTag.onclick = (e) => {
        e.stopPropagation();
        showTop7Modal();
      };
      rankingTag.onmouseover = () => {
        rankingTag.style.opacity = '0.7';
      };
      rankingTag.onmouseout = () => {
        rankingTag.style.opacity = '1';
      };
      headerContent.appendChild(rankingTag);
    } else if (mainSpirit.lightRanking) {
      const rankingTag = document.createElement('p');
      rankingTag.className = 'spirit-profile-ranking';
      rankingTag.style.fontSize = '12px';
      rankingTag.style.color = 'var(--accent)';
      rankingTag.style.margin = '4px 0 0 0';
      rankingTag.style.fontWeight = '600';
      rankingTag.style.cursor = 'pointer';
      rankingTag.style.textDecoration = 'underline';
      rankingTag.textContent = `Ranked ${getOrdinal(mainSpirit.lightRanking)} in kingdom of Light`;
      rankingTag.onclick = (e) => {
        e.stopPropagation();
        showTop7LightModal();
      };
      rankingTag.onmouseover = () => {
        rankingTag.style.opacity = '0.7';
      };
      rankingTag.onmouseout = () => {
        rankingTag.style.opacity = '1';
      };
      headerContent.appendChild(rankingTag);
    }
    
    // Add main spirit description (use mainDescription if available, otherwise use description)
    if (mainSpirit.mainDescription || mainSpirit.description) {
      const mainDesc = document.createElement('p');
      mainDesc.className = 'spirit-profile-main-description';
      mainDesc.style.fontSize = '12px';
      mainDesc.style.color = 'var(--ink-soft)';
      mainDesc.style.margin = '8px 0 0 0';
      mainDesc.style.lineHeight = '1.4';
      mainDesc.textContent = mainSpirit.mainDescription || mainSpirit.description;
      headerContent.appendChild(mainDesc);
    }
    
    spiritProfileHeader.appendChild(headerContent);

    // Build profile body
    spiritProfileBody.innerHTML = '';

    // Add primary names blurb before alternate names (only if spirit has aliases)
    if (mainSpirit.alsoKnownAs && mainSpirit.alsoKnownAs.length > 0) {
      const primaryNamesBlurb = document.createElement('p');
      primaryNamesBlurb.style.fontSize = '12px';
      primaryNamesBlurb.style.color = 'var(--ink-soft)';
      primaryNamesBlurb.style.margin = '0 0 14px 0';
      primaryNamesBlurb.style.lineHeight = '1.5';
      primaryNamesBlurb.style.fontStyle = 'normal';
      primaryNamesBlurb.style.paddingBottom = '14px';
      primaryNamesBlurb.style.borderBottom = '1px solid #f0ede7';
      primaryNamesBlurb.textContent = mainSpirit.type === 'Demonic Principality'
        ? `This principality is known by many names across different cultures and religions, but is fundamentally the same demonic principality.`
        : `This spirit is known by many names across different cultures and religions, but is fundamentally the same demonic or angelic force.`;
      spiritProfileBody.appendChild(primaryNamesBlurb);
    }

    // Alternate names section
    if (mainSpirit.alsoKnownAs && mainSpirit.alsoKnownAs.length > 0) {
      const altSection = document.createElement('div');
      altSection.className = 'spirit-profile-section';
      
      const altTitle = document.createElement('p');
      altTitle.className = 'spirit-profile-section-title';
      altTitle.textContent = 'Also Known As';
      altSection.appendChild(altTitle);
      
      // Show all alternate names
      const allNames = [mainSpirit.name, ...mainSpirit.alsoKnownAs];
      allNames.forEach(name => {
        if (name !== displayName) { // Don't show the current name as an alternate
          const altItem = document.createElement('p');
          altItem.className = 'spirit-profile-item';
          altItem.style.cursor = 'pointer';
          altItem.style.textDecoration = 'underline';
          altItem.style.color = 'var(--ink)';
          altItem.textContent = name;
          altItem.onclick = () => showSpiritProfile(name); // Pass the alias name directly
          altSection.appendChild(altItem);
        }
      });
      
      spiritProfileBody.appendChild(altSection);
    }
    
    // Add "Manifestations in:" header for location descriptions
    const manifestHeader = document.createElement('p');
    manifestHeader.style.fontSize = '11.5px';
    manifestHeader.style.letterSpacing = '0.04em';
    manifestHeader.style.textTransform = 'uppercase';
    manifestHeader.style.fontWeight = '500';
    manifestHeader.style.color = 'var(--ink-soft)';
    manifestHeader.style.margin = '12px 0 8px 0';
    manifestHeader.textContent = 'Manifestations in:';
    spiritProfileBody.appendChild(manifestHeader);

    // Description section - show this spirit's descriptions by location,
    // matching against the full transitive identity network so cultural
    // names like Ra/Apollo all resolve to the same underlying spirit.
    // Also track the specific local/cultural name used at each location.
    const descriptionsByLocation = [];
    for (let city of cities) {
      // Check ruling spirits - match by identity network
      for (let spirit of city.rulingSpirits) {
        if (identityGroup.has(spirit.name)) {
          descriptionsByLocation.push({
            description: spirit.description,
            city: city.name,
            country: city.country,
            localName: spirit.name
          });
        }
      }

      // Check demonic spirits - match by identity network
      for (let spirit of city.demonicPrincipalities) {
        if (identityGroup.has(spirit.name)) {
          descriptionsByLocation.push({
            description: spirit.description,
            city: city.name,
            country: city.country,
            localName: spirit.name
          });
        }
      }
    }

    if (descriptionsByLocation.length > 0) {
      const descSection = document.createElement('div');
      descSection.className = 'spirit-profile-section';
      
      descriptionsByLocation.forEach((desc, idx) => {
        const descP = document.createElement('p');
        descP.className = 'spirit-profile-description';

        const locationPrefix = document.createElement('strong');
        locationPrefix.textContent = `${desc.city}, ${desc.country} (as `;
        descP.appendChild(locationPrefix);

        const nameTag = document.createElement('strong');
        nameTag.textContent = desc.localName;
        nameTag.style.cursor = 'pointer';
        nameTag.style.textDecoration = 'underline';
        nameTag.style.color = 'var(--accent)';
        nameTag.onclick = (e) => {
          e.stopPropagation();
          showSpiritProfile(desc.localName);
        };
        descP.appendChild(nameTag);

        const locationSuffix = document.createElement('strong');
        locationSuffix.textContent = '):';
        descP.appendChild(locationSuffix);

        descP.appendChild(document.createElement('br'));
        const descTextSpan = document.createElement('span');
        descTextSpan.innerHTML = desc.description;
        descP.appendChild(descTextSpan);

        descSection.appendChild(descP);
        
        // Add spacing between multiple descriptions
        if (idx < descriptionsByLocation.length - 1) {
          descP.style.marginBottom = '12px';
        }
      });
      
      spiritProfileBody.appendChild(descSection);
    }

    // Locations section
    if (foundLocations.length > 0) {
      // Sort locations: Continental first, then by date (newest first)
      foundLocations.sort((a, b) => {
        // Continental locations come first
        if (a.country === 'Continental' && b.country !== 'Continental') return -1;
        if (a.country !== 'Continental' && b.country === 'Continental') return 1;
        // Then sort by date (newest first)
        return new Date(b.date) - new Date(a.date);
      });
      
      const locSection = document.createElement('div');
      locSection.className = 'spirit-profile-section';
      
      const locTitle = document.createElement('p');
      locTitle.className = 'spirit-profile-section-title';
      locTitle.textContent = `Found In (${foundLocations.length})`;
      locSection.appendChild(locTitle);
      
      foundLocations.forEach(loc => {
        const locCard = document.createElement('div');
        locCard.className = 'spirit-profile-location-card';
        locCard.onclick = () => {
          const city = cities.find(c => c.name === loc.name);
          if (city) {
            spiritProfile.classList.remove('show');
            openCity(city);
          }
        };
        
        const locName = document.createElement('p');
        locName.className = 'spirit-profile-location-name';
        locName.textContent = `${loc.name}, ${loc.country}`;
        
        const locDate = document.createElement('p');
        locDate.className = 'spirit-profile-location-date';
        locDate.textContent = loc.date;
        
        locCard.appendChild(locName);
        locCard.appendChild(locDate);
        locSection.appendChild(locCard);
      });
      
      spiritProfileBody.appendChild(locSection);
    }

    // Instagram Posts section
    const instagramPosts = [];
    const top7PostUrl = 'https://www.instagram.com/p/DXVP3z0DyyO';
    const top7LightPostUrl = 'https://www.instagram.com/p/DXQHNpPD9OQ';
    
    for (let city of cities) {
      // Check if spirit appears in this city (ruling or demonic) - match by identity network
      let hasSpirit = false;
      
      for (let spirit of city.rulingSpirits) {
        if (identityGroup.has(spirit.name)) {
          hasSpirit = true;
          break;
        }
      }
      
      if (!hasSpirit) {
        for (let spirit of city.demonicPrincipalities) {
          if (identityGroup.has(spirit.name)) {
            hasSpirit = true;
            break;
          }
        }
      }
      
      // If spirit is in this city, collect its Instagram links with location tracking (exclude Top 7 explanation posts)
      if (hasSpirit) {
        if (city.videoUrls && Array.isArray(city.videoUrls)) {
          city.videoUrls.forEach((url, urlIdx) => {
            if (url !== '#' && url !== top7PostUrl && url !== top7LightPostUrl) {
              instagramPosts.push({ url, city: city.name, country: city.country, urlIndex: urlIdx, totalUrlsForCity: city.videoUrls.length });
            }
          });
        } else if (city.videoUrl && city.videoUrl !== '#') {
          instagramPosts.push({ url: city.videoUrl, city: city.name, country: city.country, urlIndex: 0, totalUrlsForCity: 1 });
        }
      }
    }

    // Add Top 7 explanation post if this spirit is in the Kingdom of darkness
    if (mainSpirit.topRanking) {
      instagramPosts.push({ 
        url: 'https://www.instagram.com/p/DXVP3z0DyyO', 
        city: 'Kingdom of darkness', 
        country: 'Explanation', 
        isTop7: true,
        urlIndex: 0, 
        totalUrlsForCity: 1 
      });
    }

    // Add Top 7 explanation post if this spirit is in the Kingdom of Light
    if (mainSpirit.lightRanking) {
      instagramPosts.push({ 
        url: 'https://www.instagram.com/p/DXQHNpPD9OQ', 
        city: 'Kingdom of Light', 
        country: 'Explanation', 
        isTop7Light: true,
        urlIndex: 0, 
        totalUrlsForCity: 1 
      });
    }

    if (instagramPosts.length > 0) {
      const instSection = document.createElement('div');
      instSection.className = 'spirit-profile-section';
      
      const instTitle = document.createElement('p');
      instTitle.className = 'spirit-profile-section-title';
      instTitle.textContent = `Instagram Posts (${instagramPosts.length})`;
      instSection.appendChild(instTitle);
      
      instagramPosts.forEach((post, idx) => {
        const postLink = document.createElement('a');
        postLink.href = post.url;
        postLink.target = '_blank';
        postLink.style.display = 'block';
        postLink.style.padding = '12px';
        postLink.style.background = '#f9f7f4';
        postLink.style.border = '1px solid #f0ede7';
        postLink.style.borderRadius = '3px';
        postLink.style.marginBottom = '8px';
        postLink.style.textDecoration = 'none';
        postLink.style.color = 'var(--ink)';
        postLink.style.cursor = 'pointer';
        postLink.style.transition = 'background 0.2s';
        
        postLink.onmouseover = () => {
          postLink.style.background = '#f3efe8';
        };
        postLink.onmouseout = () => {
          postLink.style.background = '#f9f7f4';
        };
        
        // Show Part X if the location has multiple posts, or Top 7 label
        const postCity = document.createElement('p');
        postCity.style.fontWeight = '500';
        postCity.style.fontSize = '12px';
        postCity.style.margin = '0 0 2px 0';
        postCity.style.color = 'var(--ink)';
        
        if (post.isTop7Light) {
          postCity.textContent = 'Top 7 of God\'s Kingdom of Light Explained';
        } else if (post.isTop7) {
          postCity.textContent = 'Top 7 of Satan\'s Kingdom of darkness Explained';
        } else {
          const partNumber = post.totalUrlsForCity > 1 ? ` - Part ${post.urlIndex + 1}` : '';
          postCity.textContent = `${post.city}, ${post.country}${partNumber}`;
        }
        
        const postLabel = document.createElement('p');
        postLabel.style.fontSize = '11px';
        postLabel.style.color = 'var(--ink-faint)';
        postLabel.style.margin = '0';
        postLabel.textContent = 'View on Instagram ↗';
        
        postLink.appendChild(postCity);
        postLink.appendChild(postLabel);
        instSection.appendChild(postLink);
      });
      
      spiritProfileBody.appendChild(instSection);
    }

    spiritProfile.classList.add('show');
  }

  spiritProfileClose.addEventListener('click', () => {
    spiritProfile.classList.remove('show');
  });

  spiritProfile.addEventListener('click', (e) => {
    if (e.target === spiritProfile) {
      spiritProfile.classList.remove('show');
    }
  });

  // =================================================================
  // SEARCH
  // =================================================================
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  searchInput.addEventListener('input', () => {
    const term = searchInput.value.trim().toLowerCase();
    searchResults.innerHTML = '';
    if (!term) { searchResults.classList.remove('show'); return; }

    const matches = cities.filter(c => {
      // Search city name and country
      if (c.name.toLowerCase().includes(term) || c.country.toLowerCase().includes(term)) return true;
      
      // Search ruling spirits, their types, and alternate names
      if (c.rulingSpirits.some(s => {
        if (s.name.toLowerCase().includes(term) || s.type.toLowerCase().includes(term)) return true;
        if (s.alsoKnownAs && s.alsoKnownAs.some(alt => alt.toLowerCase().includes(term))) return true;
        return false;
      })) return true;
      
      // Search demonic principalities, their types and alternate names
      if (c.demonicPrincipalities.some(d => {
        if (d.name.toLowerCase().includes(term) || d.type.toLowerCase().includes(term)) return true;
        if (d.alsoKnownAs && d.alsoKnownAs.some(alt => alt.toLowerCase().includes(term))) return true;
        return false;
      })) return true;
      
      return false;
    });

    if (matches.length === 0) { searchResults.classList.remove('show'); return; }

    matches.forEach(c => {
      const item = document.createElement('div');
      item.className = 'search-result-item';
      item.innerHTML = `<strong>${c.name}</strong><span>${c.country}</span>`;
      item.addEventListener('click', () => {
        openCity(c);
        searchResults.classList.remove('show');
        searchInput.value = '';
      });
      searchResults.appendChild(item);
    });

    searchResults.classList.add('show');
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) searchResults.classList.remove('show');
  });
</script>

</body>
</html>
