<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phoenix's Map</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f4efe4;
    --paper-deep: #e7ddc9;
    --ink: #2b2620;
    --ink-soft: rgba(43,38,32,0.58);
    --ink-faint: rgba(43,38,32,0.38);
    --accent: #a9784f;
    --accent-soft: rgba(169,120,79,0.16);
    --line: rgba(43,38,32,0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  #map {
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* ---- top bar ---- */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 500;
    padding: 22px 24px 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }

  .title-block { pointer-events: auto; }
  .title-block h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 32px;
    line-height: 1;
    margin: 0;
    color: var(--ink);
  }
  .title-block p {
    margin: 6px 0 0 0;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .search-wrap {
    position: relative;
    pointer-events: auto;
    width: 250px;
  }
  .search-input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 11px 13px;
    color: var(--ink);
    font-size: 13.5px;
    font-family: 'Inter', sans-serif;
    outline: none;
    box-shadow: 0 1px 2px rgba(43,38,32,0.05);
  }
  .search-input::placeholder { color: var(--ink-faint); }
  .search-input:focus { border-color: var(--accent); }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
    display: none;
    box-shadow: 0 6px 20px rgba(43,38,32,0.08);
  }
  .search-results.show { display: block; }
  .search-result-item {
    padding: 10px 13px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: var(--paper-deep); }
  .search-result-item strong { color: var(--ink); }
  .search-result-item span { color: var(--ink-faint); font-size: 11.5px; margin-left: 6px; }

  /* ---- legend ---- */
  .legend {
    position: absolute;
    bottom: 24px;
    left: 24px;
    z-index: 500;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 11px 16px;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    display: flex;
    gap: 16px;
    box-shadow: 0 1px 2px rgba(43,38,32,0.05);
    pointer-events: auto;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .legend-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  /* ---- side panel ---- */
  .panel {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 340px;
    background: var(--paper);
    border-left: 1px solid var(--line);
    z-index: 600;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.65,0,0.35,1);
    display: flex;
    flex-direction: column;
    box-shadow: -12px 0 30px rgba(43,38,32,0.06);
  }
  .panel.open { transform: translateX(0); }

  .panel-header {
    padding: 30px 26px 20px 26px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .panel-header h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 28px;
    margin: 0;
    color: var(--ink);
  }
  .panel-header p {
    margin: 5px 0 0 0;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .panel-close {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .panel-close:hover { color: var(--ink); }

  .panel-body {
    padding: 6px 26px 26px 26px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .panel-body::-webkit-scrollbar { width: 5px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .video-card {
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }
  .video-card:last-child { border-bottom: none; }
  .video-card .creator {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 6px 0;
    color: var(--ink);
  }
  .video-card .caption {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 12px 0;
  }
  .video-card .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .tag-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .video-link {
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.03em;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-faint);
    white-space: nowrap;
  }
  .video-link:hover { border-bottom-color: var(--ink); }

  .no-videos {
    font-size: 13px;
    color: var(--ink-faint);
  }

  /* ---- leaflet overrides ---- */
  .leaflet-popup-content-wrapper {
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    border: 1px solid var(--line);
    box-shadow: 0 6px 20px rgba(43,38,32,0.08);
  }
  .leaflet-popup-tip { background: var(--paper); border: 1px solid var(--line); border-top: none; }
  .leaflet-popup-content {
    margin: 12px 14px;
    font-family: 'Inter', sans-serif;
  }
  .leaflet-popup-content p {
    margin: 0 0 8px 0;
  }

  .popup-city {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 18px;
    color: var(--ink);
  }
  .popup-count {
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .popup-link {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-faint);
    margin-top: 4px;
  }
  .popup-link:hover { border-bottom-color: var(--ink); }

  .leaflet-control-zoom-in,
  .leaflet-control-zoom-out {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    font-size: 16px;
    font-weight: 600;
    width: 34px !important;
    height: 34px !important;
    line-height: 34px;
  }
  .leaflet-control-zoom-in:hover,
  .leaflet-control-zoom-out:hover {
    background: var(--paper-deep);
  }

  .marker-pin {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(43,38,32,0.15);
    cursor: pointer;
  }
  .marker-pin.selected {
    background: var(--ink);
    box-shadow: 0 4px 12px rgba(43,38,32,0.25);
  }
  .marker-pin span {
    font-size: 13px;
    color: var(--paper);
    font-weight: 600;
  }

  .marker-cluster {
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--ink);
  }

  @media (max-width: 640px) {
    .panel { width: 100%; }
    .search-wrap { width: 140px; }
    .title-block p { display: none; }
    .legend { flex-wrap: wrap; max-width: calc(100% - 48px); }
  }

  ::selection { background: var(--accent-soft); }
</style>
</head>
<body>

<div id="map"></div>

<div class="top-bar">
  <div class="title-block">
    <h1>Phoenix's Map</h1>
    <p>Locations from around the world.</p>
  </div>
  <div class="search-wrap">
    <input type="text" class="search-input" id="searchInput" placeholder="Search city..." autocomplete="off" />
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="legend" id="legend"></div>

<div class="panel" id="panel">
  <div class="panel-header">
    <div>
      <h2 id="panelCity">City</h2>
      <p id="panelSub">Videos</p>
    </div>
    <button class="panel-close" id="panelClose">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>

<script>
  // =================================================================
  // DATA
  // =================================================================
  const categoryColors = {
    "Spiritual Mapping": "#a9784f"
  };

  const cities = [
    { name: "Lisbon", country: "Portugal", lat: 38.7223, lng: -9.1393, category: "Spiritual Mapping",
      videos: [{ creator: "@phoenixfromphoenixx", caption: "Apollo (spirit of pride for talents/abilities) & Moloch replaced by Humility & God's anointing on true gifts", category: "Spiritual Mapping", videoUrl: "https://www.instagram.com/p/DcjXJs1jXSO/" }] }
  ];

  // =================================================================
  // MAP SETUP
  // =================================================================
  const map = L.map('map').setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  // ===== legend =====
  const legendEl = document.getElementById('legend');
  Object.entries(categoryColors).forEach(([name, color]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${name}`;
    legendEl.appendChild(item);
  });

  // =================================================================
  // MARKERS
  // =================================================================
  const markerGroup = L.featureGroup().addTo(map);
  const markersByCity = {};

  cities.forEach(city => {
    const icon = L.divIcon({
      html: `<div class="marker-pin"><span>${city.videos.length}</span></div>`,
      iconSize: [28, 28],
      className: ''
    });

    const marker = L.marker([city.lat, city.lng], { icon })
      .on('click', () => openCity(city))
      .bindPopup(`
        <p class="popup-city">${city.name}</p>
        <p class="popup-count">${city.videos.length} video${city.videos.length !== 1 ? 's' : ''}</p>
        <a class="popup-link" href="#">View details →</a>
      `);

    markerGroup.addLayer(marker);
    markersByCity[city.name] = { marker, city };
  });

  // =================================================================
  // PANEL
  // =================================================================
  const panel = document.getElementById('panel');
  const panelCity = document.getElementById('panelCity');
  const panelSub = document.getElementById('panelSub');
  const panelBody = document.getElementById('panelBody');

  function openCity(city) {
    panelCity.textContent = city.name;
    panelSub.textContent = `${city.country} · ${city.videos.length} video${city.videos.length !== 1 ? 's' : ''}`;

    panelBody.innerHTML = '';
    city.videos.forEach(v => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <p class="creator">${v.creator}</p>
        <p class="caption">${v.caption}</p>
        <div class="card-footer">
          <span class="tag"><span class="tag-dot" style="background:${categoryColors[v.category]}"></span>${v.category}</span>
          <a class="video-link" href="${v.videoUrl}" target="_blank">Watch ↗</a>
        </div>
      `;
      panelBody.appendChild(card);
    });

    panel.classList.add('open');
    
    // highlight marker
    document.querySelectorAll('.marker-pin').forEach(m => m.classList.remove('selected'));
    const marker = markersByCity[city.name]?.marker;
    if (marker) {
      marker.getElement()?.querySelector('.marker-pin').classList.add('selected');
    }

    // pan map to city
    map.setView([city.lat, city.lng], 10, { animate: true });
  }

  document.getElementById('panelClose').addEventListener('click', () => {
    panel.classList.remove('open');
    document.querySelectorAll('.marker-pin').forEach(m => m.classList.remove('selected'));
  });

  // =================================================================
  // SEARCH
  // =================================================================
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  searchInput.addEventListener('input', () => {
    const term = searchInput.value.trim().toLowerCase();
    searchResults.innerHTML = '';
    if (!term) { searchResults.classList.remove('show'); return; }

    const matches = cities.filter(c => 
      c.name.toLowerCase().includes(term) || 
      c.country.toLowerCase().includes(term)
    );

    if (matches.length === 0) { searchResults.classList.remove('show'); return; }

    matches.forEach(c => {
      const item = document.createElement('div');
      item.className = 'search-result-item';
      item.innerHTML = `<strong>${c.name}</strong><span>${c.country}</span>`;
      item.addEventListener('click', () => {
        openCity(c);
        searchResults.classList.remove('show');
        searchInput.value = '';
      });
      searchResults.appendChild(item);
    });

    searchResults.classList.add('show');
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) searchResults.classList.remove('show');
  });
</script>

</body>
</html>
